<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>European Horizon Virtual Airline | Offizieller VATSIM Partner</title>
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #0a1128;
            --accent-gold: #d4af37;
            --accent-blue: #0077b6;
            --accent-hover: #0096c7;
            --discord-color: #5865F2;
            --discord-hover: #4752C4;
            --bg: #050814;
            --card-bg: rgba(16, 24, 48, 0.75);
            --border: rgba(212, 175, 55, 0.2);
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 119, 182, 0.15) 0%, transparent 60%),
                radial-gradient(circle at 80% 80%, rgba(212, 175, 55, 0.08) 0%, transparent 50%);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        header {
            padding: 3rem 1rem 1.5rem;
            text-align: center;
        }

        .header-banner {
            max-width: 650px;
            width: 90%;
            height: auto;
            filter: drop-shadow(0 4px 20px rgba(0, 119, 182, 0.3));
            transition: transform 0.3s ease;
        }

        .header-banner:hover {
            transform: scale(1.02);
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1.15rem;
            margin-top: 0.75rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        main {
            max-width: 850px;
            margin: 0 auto;
            padding: 1.5rem 1rem 3rem;
            width: 100%;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 3rem 2rem;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
        }

        .roundel-logo {
            width: 210px;
            height: 210px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 1.5rem;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6), 0 0 15px rgba(212, 175, 55, 0.3);
            border: 2px solid rgba(212, 175, 55, 0.4);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .roundel-logo:hover {
            transform: scale(1.03) rotate(1deg);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.7), 0 0 25px rgba(212, 175, 55, 0.5);
        }

        .card h2 {
            font-size: 1.8rem;
            margin-bottom: 1rem;
            color: var(--text);
            font-weight: 700;
        }

        .card p {
            color: var(--text-muted);
            margin-bottom: 2rem;
            max-width: 650px;
            margin-left: auto;
            margin-right: auto;
            font-size: 1.05rem;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-weight: 600;
            font-size: 1.05rem;
            padding: 0.9rem 2rem;
            border-radius: 10px;
            text-decoration: none;
            transition: all 0.25s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-newsky {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-hover));
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(0, 119, 182, 0.4);
        }

        .btn-newsky:hover {
            background: linear-gradient(135deg, var(--accent-hover), #00b4d8);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 119, 182, 0.6);
        }

        .btn-discord {
            background-color: var(--discord-color);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(88, 101, 242, 0.4);
        }

        .btn-discord:hover {
            background-color: var(--discord-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(88, 101, 242, 0.6);
        }

        footer {
            padding: 3rem 1rem 2rem;
            text-align: center;
            background: rgba(5, 8, 20, 0.8);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            margin-top: auto;
        }

        .vatsim-section {
            margin-bottom: 1.5rem;
        }

        .vatsim-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            margin-bottom: 0.75rem;
            display: block;
        }

        .vatsim-badge img {
            height: 50px;
            width: auto;
            opacity: 0.9;
            transition: all 0.2s ease;
            filter: drop-shadow(0 2px 8px rgba(255, 255, 255, 0.1));
        }

        .vatsim-badge img:hover {
            opacity: 1;
            transform: scale(1.05);
            filter: drop-shadow(0 4px 12px rgba(0, 119, 182, 0.4));
        }

        .footer-links {
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .footer-links a {
            color: var(--text-muted);
            text-decoration: underline;
            margin: 0 10px;
            transition: color 0.2s;
        }

        .footer-links a:hover {
            color: var(--accent-gold);
        }
    </style>
</head>
<body>

        <p class="subtitle">Virtual Airline • Fly | Explore | Connect</p>
    </header>
